services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ged_notaire}
      POSTGRES_USER: ${POSTGRES_USER:-ged_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ged_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ged_notaire}
      DJANGO_SETTINGS_MODULE: ged_backend.settings.prod
      SERVE_FRONTEND: "false"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media_data:/app/backend/media
      - backup_data:/app/backend/backup_store
      - static_data:/app/backend/staticfiles

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../:/usr/share/nginx/html:ro
      - static_data:/var/www/static:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/api/health | grep -qE '\"status\":[[:space:]]*\"ok\"'"]
      interval: 30s
      timeout: 5s
      retries: 5

  backup:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ged_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ged_notaire}
      DJANGO_SETTINGS_MODULE: ged_backend.settings.prod
      SERVE_FRONTEND: "false"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media_data:/app/backend/media:ro
      - backup_data:/app/backend/backup_store
    command: ["/bin/sh", "-c", "while true; do python manage.py backup_ged || true; sleep ${BACKUP_INTERVAL_SECONDS:-21600}; done"]

volumes:
  postgres_data:
  media_data:
  backup_data:
  static_data:
