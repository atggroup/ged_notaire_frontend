# Journaux des conteneurs : rotation (10 Mo × 5 fichiers par service). Sans
# elle, les journaux Docker grossissent sans limite jusqu'à remplir le disque.
x-journaux: &journaux
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *journaux
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ged_notaire}
      POSTGRES_USER: ${POSTGRES_USER:-ged_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    logging: *journaux
    env_file:
      - ${GED_ENV_FILE:-.env.prod}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ged_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ged_notaire}
      DJANGO_SETTINGS_MODULE: ged_backend.settings.prod
      SERVE_FRONTEND: "false"
      # Chaque dépôt est analysé par ClamAV avant d'être enregistré.
      ANTIVIRUS_HOST: clamav
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media_data:/app/backend/media
      - backup_data:/app/backend/backup_store
      - static_data:/app/backend/staticfiles

  # Antivirus des dépôts. Met à jour ses signatures seul (freshclam) ; compte
  # ~1,5 Go de mémoire. Au démarrage, le chargement des signatures prend
  # quelques minutes : les dépôts sont refusés (503) tant qu'il n'est pas prêt.
  clamav:
    image: clamav/clamav:1.4
    restart: unless-stopped
    logging: *journaux
    volumes:
      - clamav_db:/var/lib/clamav

  # Porte d'entrée HTTPS : seul service exposé sur Internet (ports 80/443).
  # Certificat obtenu et renouvelé automatiquement pour GED_DOMAIN.
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    logging: *journaux
    depends_on:
      - nginx
    env_file:
      - ${GED_ENV_FILE:-.env.prod}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      bordure:
        # Adresse fixe : c'est la seule source dont nginx accepte l'adresse
        # réelle du client (set_real_ip_from, deploy/nginx.conf).
        ipv4_address: 172.28.0.10

  # nginx n'est plus publié : il n'est joignable que par Caddy (réseau
  # `bordure`) et joint lui-même l'API sur le réseau interne par défaut.
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    logging: *journaux
    depends_on:
      - web
    networks:
      - default
      - bordure
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../:/usr/share/nginx/html:ro
      - static_data:/var/www/static:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/api/health | grep -qE '\"status\":[[:space:]]*\"ok\"'"]
      interval: 30s
      timeout: 5s
      retries: 5

  # Exécutants des automatisations (`python manage.py run_worker`). Ils
  # remplacent les anciennes boucles shell qui avalaient toute erreur :
  # chaque travail est verrouillé, tracé (écran Sauvegarde ·
  # Supervision), journalisé, retenté, et son échec est notifié au notaire.
  #
  # `sauvegarde` a son propre exécutant : une sauvegarde longue ne doit pas
  # retarder l'OCR ni les rappels. Liste des travaux :
  #   docker compose exec travaux python manage.py run_worker --liste
  sauvegarde:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    logging: *journaux
    env_file:
      - ${GED_ENV_FILE:-.env.prod}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ged_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ged_notaire}
      DJANGO_SETTINGS_MODULE: ged_backend.settings.prod
      SERVE_FRONTEND: "false"
      RUN_MIGRATIONS: "false"
      # Même réglage que `web` : la production exige un antivirus déclaré.
      ANTIVIRUS_HOST: clamav
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_started
    volumes:
      - media_data:/app/backend/media:ro
      - backup_data:/app/backend/backup_store
    # Travaux : sauvegarde (+ rotation), fraîcheur, exercice PRA hebdomadaire.
    # Équivalent ponctuel : python manage.py backup_ged / restore_drill
    command: ["python", "manage.py", "run_worker", "--groupe", "sauvegarde", "--nom", "sauvegarde"]

  # OCR, rappels d'échéances (manage.py envoyer_rappels en ponctuel), e-mails,
  # pièces manquantes, surveillance de sécurité, intégrité de l'audit, nettoyage.
  travaux:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    logging: *journaux
    env_file:
      - ${GED_ENV_FILE:-.env.prod}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ged_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ged_notaire}
      DJANGO_SETTINGS_MODULE: ged_backend.settings.prod
      SERVE_FRONTEND: "false"
      RUN_MIGRATIONS: "false"
      # Même réglage que `web` : la production exige un antivirus déclaré.
      ANTIVIRUS_HOST: clamav
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_started
    volumes:
      - media_data:/app/backend/media:ro
    command: ["python", "manage.py", "run_worker", "--sauf-groupe", "sauvegarde", "--nom", "travaux"]

networks:
  default:
  bordure:
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  postgres_data:
  media_data:
  backup_data:
  static_data:
  caddy_data:
  caddy_config:
  clamav_db:
