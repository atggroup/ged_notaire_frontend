# Protocole vu par le navigateur. nginx n'est joignable QUE par Caddy (aucun
# port publié, voir docker-compose.yml), qui termine le TLS et pose lui-même
# X-Forwarded-Proto : sans cette reprise, Django croirait chaque requête en
# HTTP et redirigerait à l'infini.
map $http_x_forwarded_proto $proto_client {
    default $scheme;
    https   https;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 30m;

    # Adresse réelle du client : acceptée UNIQUEMENT depuis Caddy, dont
    # l'adresse est fixée sur le réseau interne `bordure`. Caddy ignore le
    # X-Forwarded-For envoyé par un client et écrit le sien ; toute autre
    # source est ignorée, l'en-tête reste donc infalsifiable.
    set_real_ip_from 172.28.0.10;
    real_ip_header X-Forwarded-For;
    real_ip_recursive off;

    root /usr/share/nginx/html;

    # Adresse de Django résolue à CHAQUE requête (DNS interne de Docker) et
    # non une seule fois au démarrage : sinon, recréer le conteneur web lors
    # d'une mise à jour lui donne une nouvelle adresse et nginx répond
    # « 502 Bad Gateway » jusqu'à son propre redémarrage (constaté en test).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $django web:8000;

    # Le volume monté ici est la racine du dépôt : il contient aussi bien le
    # frontal que `backend/` (dont .env.prod), les notes internes et .git.
    # Tout ce qui n'est pas explicitement autorisé plus bas est donc refusé,
    # sur le même principe que le garde-fou Django (ged_backend/frontend.py).
    # Sans ces règles, un simple GET /backend/.env.prod livrait la clé de
    # chiffrement documentaire, le secret Django et le mot de passe de la base.

    # ------------------------------------------------------------------ API
    location = /api/health {
        proxy_pass http://$django/api/health;
        # Hôte fixe : la sonde interne (127.0.0.1) doit rester acceptée par
        # ALLOWED_HOSTS, qui ne contient que le domaine et `localhost`.
        # Depuis Internet, Caddy ne relaie que le domaine de l'étude.
        proxy_set_header Host localhost;
        proxy_set_header X-Forwarded-Proto $proto_client;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ^~ /api/ {
        proxy_pass http://$django;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $proto_client;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 180s;
    }

    location = /auth/oauth/google/callback {
        proxy_pass http://$django;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $proto_client;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # /admin/ n'est plus relayé : l'admin Django contourne le second facteur,
    # le verrouillage de compte et le journal d'audit. Les requêtes tombent
    # sur l'écran de connexion (location / ci-dessous).

    location ^~ /static/ {
        alias /var/www/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # ------------------------------------------------- Interdictions strictes
    # Sources, secrets, sauvegardes, dépôt git, notes internes.
    location ~ ^/(backend|\.git|\.claude|\.venv|node_modules)(/|$) { return 404; }
    # Tout fichier ou répertoire caché (.env, .gitignore, .dockerignore…).
    location ~ /\.                                                 { return 404; }
    # Documentation interne laissée à la racine du dépôt.
    location ~* \.(md|py|pyc|yml|yaml|toml|ini|cfg|sql|log|bak|enc|sqlite3?)$ { return 404; }

    # --------------------------------------------------------------- Frontal
    # Liste blanche d'extensions, calquée sur ALLOWED_SUFFIXES côté Django.
    location ~* \.(html|css|js|map|svg|png|jpe?g|gif|webp|ico|woff2?|ttf|mp4|webm)$ {
        # En production, les pages sont servies par nginx et non par Django :
        # les en-têtes de sécurité du middleware ne les couvriraient pas.
        # On les repose donc ici, à l'identique (ged_backend/securite.py).
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; frame-ancestors 'none'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        # Revalidation à chaque chargement (réponse 304 si inchangé) : après
        # une mise à jour, aucun poste ne garde l'ancien app.js en cache.
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Racine et chemins sans extension : on renvoie l'écran de connexion,
    # jamais un fichier arbitraire du dépôt.
    location / {
        return 302 /login.html;
    }
}
