  </defs>

  <!-- ground shadow -->
  <ellipse cx="205" cy="393" rx="150" ry="16" fill="rgba(15,8,40,.16)"/>

  <!-- tree trunk -->
  <path d="M298 130 Q292 250 296 388 L318 388 Q316 250 316 130 Z" fill="#1E1633"/>
  <!-- tree foliage -->
  <circle cx="305" cy="150" r="98" fill="url(#foliage)"/>
  <circle cx="255" cy="110" r="46" fill="#6C5FC4" opacity=".55"/>
  <circle cx="352" cy="185" r="34" fill="#3A3175" opacity=".5"/>

  <!-- birds -->
  <path d="M70 90 q10 -12 20 0 q10 -12 20 0" stroke="#2A2350" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M110 60 q8 -9 16 0 q8 -9 16 0" stroke="#2A2350" stroke-width="4" fill="none" stroke-linecap="round" opacity=".7"/>

  <!-- backpack -->
  <rect x="205" y="255" width="58" height="78" rx="18" fill="#7A2E3A"/>
  <rect x="222" y="240" width="24" height="30" rx="10" fill="#7A2E3A"/>
  <rect x="222" y="278" width="24" height="10" rx="4" fill="#5C1F29"/>

