<svg viewBox="0 0 400 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="foliage" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5B4FAE"/>
      <stop offset="100%" stop-color="#453B8C"/>
