  <!-- hood shading -->
  <path d="M150 178 Q192 168 210 200 Q214 210 210 220 Q182 190 150 195 Z" fill="#39306F" opacity=".55"/>

  <!-- arms holding book -->
  <path d="M118 240 Q95 255 96 285 Q97 300 118 300 L128 285 Q118 270 122 250 Z" fill="#4C43A6"/>
  <path d="M205 240 Q228 255 224 285 Q222 300 200 298 L195 282 Q205 268 200 248 Z" fill="#4C43A6"/>

  <!-- book -->
  <path d="M108 282 L160 270 L212 282 L212 300 L160 290 L108 300 Z" fill="#E7EAF6"/>
  <path d="M160 270 L160 290" stroke="#B9C0E0" stroke-width="2"/>
  <path d="M108 282 L160 270 L160 274 L108 286 Z" fill="#D8455B"/>
  <path d="M212 282 L160 270 L160 274 L212 286 Z" fill="#D8455B"/>

  <!-- head -->
  <circle cx="163" cy="172" r="34" fill="#E7B18C"/>
  <path d="M130 168 Q128 130 163 130 Q198 130 196 168 Q196 148 163 148 Q130 148 130 168 Z" fill="#1E1633"/>
  <circle cx="150" cy="176" r="2.6" fill="#2A2350"/>
  <circle cx="176" cy="176" r="2.6" fill="#2A2350"/>
  <path d="M154 190 Q163 195 172 190" stroke="#2A2350" stroke-width="2.4" fill="none" stroke-linecap="round"/>
